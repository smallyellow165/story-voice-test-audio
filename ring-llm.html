<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Ring Detection</title></head>
<body><main><header><h1>LLM Ring Detection</h1><p>上传一张房间原图，点击后发送至 Gemini 检测地面游戏圈。框为外边界，青线为模型估计的内边界；confidence 是模型自评。</p>
</header><div class="workspace"><section class="work-panel" aria-label="图片检测工作区"><div class="controls"><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><label>LLM Model <select id="model" disabled><option>Loading models…</option></select></label><button id="detect" disabled>Detect Rings with LLM</button><label><input id="overlay" type="checkbox" checked> Overlay</label><label><input id="grid" type="checkbox"> 坐标参考网格</label></div>
<p id="status" role="status">请选择图片。建议使用单张原图，避免多个 debug 窗口重复显示同一场景。</p>
<canvas id="image"></canvas><div id="results"></div></section><aside class="debug-panel" aria-label="Debug diagnostics"><h2>Debug / Diagnostics</h2><details open><summary>坐标诊断（点击图片真实圈中心取坐标，紫色十字仅为取样标记）</summary><pre id="coordinates">—</pre></details><details open><summary>原始模型 JSON</summary><pre id="json">—</pre></details></aside></div></main><script type="module" src="/src/ring-llm.ts"></script></body></html>
